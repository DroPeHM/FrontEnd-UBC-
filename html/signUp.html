<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="../css/style.css">
    <title>Farda Nova</title>
</head>
<body>
    <header>
        <div class="header-line2">
            <img class="logo" src="../img/fardanovalogo.svg" alt="Farda Nova">
        </div>
    </header>
    <main>
        <div class="formulario">
            <form>
                <div class=" nomes">
                    <div class="identity">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" minlength="2" required>
                    </div>
                    <div class="identity">
                        <label for="sobrenome">Sobrenome:</label>
                        <input type="text" id="sobrenome" minlength="5" required> 
                    </div>
                </div>
                <div class="aniversario">
                    <label for="aniversario">Data de nasc. :</label>
                    <input type="date" id="aniversario" required>
                </div>
                <div class="email-cpf">    
                    <div class="email">
                        <label for="email">Email: </label>
                        <input type="email" id="email" placeholder="example.user@gmail.com" required>
                    </div>
                    <div class="cpf-cnpj">
                        <label for="tipo">Documento: </label>
                        <select id="tipo" onchange="mudarPlaceholder()">
                            <option value="">-- Selecione --</option>
                            <option value="CPF">CPF</option>
                            <option value="CNPJ">CNPJ</option>
                        </select>
                        <input type="text" id="documento" maxlength="14" placeholder="Escolha uma opção"inputmode="numeric" disabled required>
                        
                    </div>
                </div>
                <div class="telephone">
                    <label for="telephone">Telefone: </label>
                    <input type="tel" id="telephone" placeholder="(xx) xxxxx-xxxx"pattern="\(\d{2}\) \d{5}-\d{4}"
                required/>
                </div>
                <div class="buttons-final">
                    <button class="delete" onclick="window.location.href='index.html'"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Cancelar</button>
                    <button type="submit" class="confirm"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right preview-icon"><path d="m9 18 6-6-6-6"/></svg>Avançar</button>
                </div>
            </form>
        </div>
    </main>
    <script src="../js/aesthetic.js"></script>
    <script src="../js/script.js"></script>
</body>
